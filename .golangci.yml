version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
    - bodyclose
    - copyloopvar
    - unconvert
    - unparam
    - errorlint
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - unnamedResult
    revive:
      rules:
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: package-comments
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unparam
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/scribelia-anthony/prompt-cleaner

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
