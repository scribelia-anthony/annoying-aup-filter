version: 2

project_name: annoying-aup-filter

before:
  hooks:
    - go mod tidy

builds:
  - id: annoying-aup-filter
    main: ./cmd/annoying-aup-filter
    binary: annoying-aup-filter
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

dockers:
  - image_templates:
      - "ghcr.io/scribelia-anthony/annoying-aup-filter:{{ .Version }}-amd64"
      - "ghcr.io/scribelia-anthony/annoying-aup-filter:latest-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.release
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.source=https://github.com/scribelia-anthony/annoying-aup-filter"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"
  - image_templates:
      - "ghcr.io/scribelia-anthony/annoying-aup-filter:{{ .Version }}-arm64"
      - "ghcr.io/scribelia-anthony/annoying-aup-filter:latest-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.release
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.source=https://github.com/scribelia-anthony/annoying-aup-filter"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/scribelia-anthony/annoying-aup-filter:{{ .Version }}"
    image_templates:
      - "ghcr.io/scribelia-anthony/annoying-aup-filter:{{ .Version }}-amd64"
      - "ghcr.io/scribelia-anthony/annoying-aup-filter:{{ .Version }}-arm64"
  - name_template: "ghcr.io/scribelia-anthony/annoying-aup-filter:latest"
    image_templates:
      - "ghcr.io/scribelia-anthony/annoying-aup-filter:latest-amd64"
      - "ghcr.io/scribelia-anthony/annoying-aup-filter:latest-arm64"

release:
  draft: false
  prerelease: auto
  github:
    owner: scribelia-anthony
    name: annoying-aup-filter
